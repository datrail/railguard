[package]
name = "rail-runtime"
edition = "2024"
license.workspace = true
publish.workspace = true
# Two test binaries, their modules beside them in `tests/`.
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "rail-runtime"
path = "tests/main.rs"

[[test]]
name = "rail-runtime-logs"
path = "tests/captured_logs.rs"

[dependencies]
arc-swap = "1"
# The key type rail-policy's SignedTicketConfig holds, so its major version.
ed25519-dalek = { version = "3", default-features = false }
flate2 = "1"
# Decodes a call's path, keeping an invalid escape and replacing invalid UTF-8.
percent-encoding = "2"
rail-policy = { path = "../rail-policy" }
# No system proxy, no platform verifier, no decoding: the roots are compiled in, the provider is
# ours, and gzip is decoded here, capped.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# CLOCK_BOOTTIME without unsafe code.
rustix = { version = "1", default-features = false, features = ["time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing", "std"] }
# `net` gives the Rail Center thread's runtime its IO driver, and `sync` its stop signal.
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
# `tracing-log`: reqwest and rustls log through `log`, so `init` bridges it.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "tracing-log"] }
# To read a `log` record's own target, as tracing-subscriber's formatter does.
tracing-log = { version = "0.2", default-features = false }
uuid = { version = "1", default-features = false, features = ["serde"] }
webpki-roots = "1"

[dev-dependencies]
# A library's line, as reqwest and rustls log one.
log = "0.4"
rail-test-support = { path = "../rail-test-support" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
