# Envoy v1.39, for what the example configs don't do; never an example. One listener per variant:
#
#   15001        ext_authz then ext_proc in one chain, otherwise as the examples
#   15002        ext_authz with `encode_raw_headers`, and nothing removed but by rail-envoy
#   15011-15015  ext_proc in each request body mode
#   15016        ext_authz with the body
#   15017        ext_proc `BUFFERED`, with the trailers sent too
#
# Past 15001 each fails closed, so a callout rail-envoy can't answer shows rather than passing.

static_resources:
  listeners:
    - name: both
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: both
                codec_type: AUTO
                common_http_protocol_options:
                  headers_with_underscores_action: DROP_HEADER
                early_header_mutation_extensions:
                  - name: envoy.http.early_header_mutation.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                      mutations:
                        - remove_on_match:
                            key_matcher: { exact: x-rail }
                        - remove_on_match:
                            key_matcher: { prefix: x-rail- }
                route_config: &routes
                  name: agent
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: tls }
                          route: { cluster: rail_tls, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        - match:
                            prefix: /
                            headers:
                              - name: x-rail-upstream
                                string_match: { exact: plain }
                          route: { cluster: rail_plain, timeout: 0s }
                          request_headers_to_remove: [x-rail-upstream]
                        - match: { prefix: / }
                          route: { cluster: rail_plain, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                        timeout: 1s
                      failure_mode_allow: true
                      clear_route_cache: true
                      decoder_header_mutation_rules:
                        allow_all_routing: true
                  # Sees the request as ext_authz left it, and must leave it so.
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                      mutation_rules:
                        allow_all_routing: true
                  - &forward
                    name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config: { name: dns, dns_lookup_family: V4_PREFERRED }
                  - &router
                    name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true

    # Neither the early removal nor DROP_HEADER, so the agent's x-rail and `_` headers reach
    # rail-envoy, in `header_map`, and only its answer removes them.
    - name: raw-headers
      address:
        socket_address: { address: 0.0.0.0, port_value: 15002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: raw_headers
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                        timeout: 1s
                      encode_raw_headers: true
                      clear_route_cache: true
                      decoder_header_mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    # The agent's trailers are taken over HTTP/1, which Envoy drops by default.
    - name: buffered
      address:
        socket_address: { address: 0.0.0.0, port_value: 15011 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: buffered
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: buffered-partial
      address:
        socket_address: { address: 0.0.0.0, port_value: 15012 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: buffered_partial
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED_PARTIAL
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: streamed
      address:
        socket_address: { address: 0.0.0.0, port_value: 15013 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: streamed
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: STREAMED
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: streamed-without-waiting
      address:
        socket_address: { address: 0.0.0.0, port_value: 15014 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: streamed_without_waiting
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      send_body_without_waiting_for_header_response: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: STREAMED
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: full-duplex
      address:
        socket_address: { address: 0.0.0.0, port_value: 15015 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: full_duplex
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: FULL_DUPLEX_STREAMED
                        # Envoy requires it with this body mode.
                        request_trailer_mode: SEND
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: ext-authz-body
      address:
        socket_address: { address: 0.0.0.0, port_value: 15016 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ext_authz_body
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                        timeout: 1s
                      with_request_body:
                        max_request_bytes: 1024
                        allow_partial_message: true
                        pack_as_bytes: true
                      clear_route_cache: true
                      decoder_header_mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

    - name: buffered-send-trailers
      address:
        socket_address: { address: 0.0.0.0, port_value: 15017 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: buffered_send_trailers
                http_protocol_options: { enable_trailers: true }
                route_config: *routes
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: rail_ext }
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                        request_trailer_mode: SEND
                      mutation_rules:
                        allow_all_routing: true
                  - *forward
                  - *router

  clusters:
    - name: rail_ext
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: rail_ext
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/rail/ext.sock }

    - name: rail_tls
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: dns, dns_lookup_family: V4_PREFERRED }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options: { auto_sni: true, auto_san_validation: true }
          explicit_http_config: { http_protocol_options: {} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }

    - name: rail_plain
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config: { name: dns, dns_lookup_family: V4_PREFERRED }
