[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "datrail-policy"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest"]

[tool.maturin]
# Fails on a stale Cargo.lock, as the cargo steps in CI do.
locked = true
python-source = "python"
module-name = "datrail_policy._native"
