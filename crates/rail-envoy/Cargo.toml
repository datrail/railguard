[package]
name = "rail-envoy"
edition = "2024"
# One test binary, `tests/main.rs`, its modules beside it.
autotests = false

[lib]
test = false
doctest = false

[[bin]]
name = "rail-envoy"
test = false

[[test]]
name = "rail-envoy"
path = "tests/main.rs"

[dependencies]
envoy-types = "0.7"
rail-grpc-host = { path = "../rail-grpc-host" }
rail-policy = { path = "../rail-policy" }
rail-runtime = { path = "../rail-runtime" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tonic-health = { version = "0.14", default-features = false }

[dev-dependencies]
# The tests' client.
tonic = { version = "0.14", default-features = false, features = ["channel"] }

[lints.rust]
unsafe_code = "forbid"
