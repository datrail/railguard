[package]
name = "rail-policy-py"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"] }
# The major version rail-policy uses, since its TicketVerifier holds these keys.
ed25519-dalek = { version = "3", default-features = false }
rail-policy = { path = "../rail-policy" }
# Features as rail-policy sets them; they unify, so none are added here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
