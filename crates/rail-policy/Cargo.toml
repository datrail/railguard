[package]
name = "rail-policy"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Exact doubles, and integer operands too long for one (Rail Center publishes both).
serde_json = { version = "1", features = ["arbitrary_precision"] }
uuid = { version = "1", default-features = false, features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
