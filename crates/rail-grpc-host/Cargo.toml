[package]
name = "rail-grpc-host"
edition = "2024"

# One test binary, `tests/main.rs`.
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "rail-grpc-host"
path = "tests/main.rs"

[dependencies]
rail-policy = { path = "../rail-policy" }
tokio = { version = "1", features = ["macros", "signal", "sync", "time"] }
tracing = "0.1"
# The channel is the probe's client.
tonic = { version = "0.14", default-features = false, features = ["channel"] }
tonic-health = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server"] }

[lints.rust]
unsafe_code = "forbid"
