[package]
name = "rail-envoy"
edition = "2024"

[dependencies]
envoy-types = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }

[lints.rust]
unsafe_code = "forbid"
