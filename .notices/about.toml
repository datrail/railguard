# The licences a dependency may have; the first one listed is chosen for a crate offering several.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Only what's built into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Ours, under LICENSE: every workspace crate is `publish = false`.
private = { ignore = true }

# It ships no licence file: its notice is the header of its lib.rs.
[tonic-prost.clarify]
license = "MIT"
[[tonic-prost.clarify.files]]
path = "src/lib.rs"
license = "MIT"
start = " * Copyright 2025 gRPC authors."
end = " * IN THE SOFTWARE."
checksum = "1a1b19b97943f857530a494a53e2c00b5b5f4e338ac4346897a471cf1d4fbefc"

# Its licences are in these files, not its many source headers, which cargo-about's own ring
# handling misses. LICENSE-BoringSSL's BSD parts are for its test suite, which isn't linked.
[ring.clarify]
license = "Apache-2.0 AND ISC AND MIT"
[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"
[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"
[[ring.clarify.files]]
path = "src/polyfill/once_cell/LICENSE-MIT"
license = "MIT"
checksum = "6ee2ed6c77710de911761acd5fc1ad1da00f476beb1a7ef27e78c2d1858deafc"

# Its LICENSE, not its lib.rs, whose header the crawl also picks up.
[tonic.clarify]
license = "MIT"
[[tonic.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "5c686e0f7978412b49187ae0e9f77e9b52eea9d8d2e6c0de8694b35817d873b1"
[[ring.clarify.files]]
path = "third_party/fiat/LICENSE"
