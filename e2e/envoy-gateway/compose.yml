# rail-envoy's gateway behind Envoy, in GCP's load balancer's place, over each way Envoy calls it;
# run with `make e2e-envoy-gateway`.

name: railguard-e2e-envoy-gateway

x-wiremock: &wiremock
  # Pinned by digest: a tag is mutable.
  image: wiremock/wiremock:3.9.1@sha256:8fe02bc3f9b63deb1454d41750dbaf081adf4b3e8c74fd8e31f790bee5647b88
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Serves the bundle, by the token sent, the key set, and takes denials.
  rail-center:
    <<: *wiremock
    volumes:
      - ../gateway/rail-center-mappings:/home/wiremock/mappings:ro

  # An MCP server.
  upstream:
    <<: *wiremock
    volumes:
      - ../gateway/upstream-mappings:/home/wiremock/mappings:ro

  # On a port, as on Cloud Run.
  gateway:
    build:
      context: ../..
      dockerfile: crates/rail-envoy/Dockerfile
    command: ["gateway"]
    environment:
      # Text, for a person reading the stack's output; the driver reads no log.
      RAIL_LOG_FORMAT: text
      RAIL_CALLOUT_PORT: "8080"
      RAIL_CENTER_URL: http://rail-center:8080
      RAIL_CENTER_ALLOW_HTTP: "true"
      RAIL_AUTH_MODE: bearer
      # A service token's shape; the stub serves the bundle to it alone.
      RAIL_AUTH_TOKEN: rc_svc_e2eAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      RAIL_GATEWAY_SLUG: edge
      RAIL_GATEWAY_BUNDLE_REFRESH_SECONDS: "3600"
      # Below the 5 MiB call the driver sends, so it's refused, and above its 3 MiB one.
      RAIL_MAX_BODY_MB: "4"
    # Healthy once it holds the bundle, so nothing is sent before it judges.
    healthcheck:
      test: ["CMD", "rail", "probe", "--ready"]
      interval: 1s
      # Past the probe's own 5 s, so its answer is the one recorded.
      timeout: 6s
      retries: 30
    depends_on:
      rail-center: {condition: service_healthy}

  envoy:
    image: envoyproxy/envoy:v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/10000"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      gateway: {condition: service_healthy}
      upstream: {condition: service_healthy}

  driver:
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    volumes:
      - ./driver.py:/e2e/driver.py:ro
      - ../gateway/gateway_cases.py:/e2e/gateway_cases.py:ro
    # Unbuffered, so each line shows as it's reached.
    command: ["python", "-u", "/e2e/driver.py"]
    depends_on:
      envoy: {condition: service_healthy}
