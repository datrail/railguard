[package]
name = "rail-model"
edition = "2024"
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, its modules beside it.
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "rail-model"
path = "tests/main.rs"

[features]
# The conformance vectors' runner, for the tests only.
conformance = ["time/parsing"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false }
form_urlencoded = "1"
indexmap = { version = "2", features = ["serde"] }
# Decodes a call's path, keeping an invalid escape and replacing invalid UTF-8.
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# The default parser misreads some doubles by a bit, and operands are compared as doubles.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
unicode-general-category = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
# The tests run the vectors through the runner.
rail-model = { path = ".", features = ["conformance"] }

[lints.rust]
unsafe_code = "forbid"
