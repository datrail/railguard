[package]
name = "rail-test-support"
edition = "2024"
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`.
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "rail-test-support"
path = "tests/main.rs"

[dependencies]
rail-runtime = { path = "../rail-runtime" }
# The stub Rail Center a host's tests fetch from.
tokio = { version = "1", features = ["io-util", "net", "rt", "sync"] }

[lints.rust]
unsafe_code = "forbid"
