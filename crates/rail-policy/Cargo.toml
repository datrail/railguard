[package]
name = "rail-policy"
edition = "2024"
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, its modules beside it.
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "rail-policy"
path = "tests/main.rs"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
# The default parser misreads some doubles by a bit, and operands are compared as doubles.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
unicode-general-category = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
