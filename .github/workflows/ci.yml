name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Named, not ubuntu-latest, so the runner moves on purpose.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # rustup installs the toolchain from rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p rail-policy-py -- -D warnings
      - run: cargo test --locked

      - uses: astral-sh/setup-uv@v10.3.3
      - run: make test-py
